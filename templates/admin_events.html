<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0F0F1A; color: #e0e0e0; }
        .admin-header { background: linear-gradient(135deg, #2A9D8F, #B83B5E); padding: 60px 0; text-align: center; color: white; }
        .admin-header h1 { font-size: 48px; }
        .events-section { padding: 40px; }
        .event-card { background: #16213e; border-radius: 20px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #FFD966; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 25px; background: #FFD966; color: #1a2b4a; text-decoration: none; border-radius: 50px; }
        .logout-btn { background: #e74c3c; color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; display: inline-block; margin-top: 20px; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <h1><i class="fas fa-calendar-alt"></i> Manage Events</h1>
            <a href="/admin" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <a href="/admin/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="events-section">
        <div class="event-card">
            <h3>🔥 Revelation & Power Conference</h3>
            <p>December 2026 | Word Temple Church Grounds</p>
        </div>
        <div class="event-card">
            <h3>🌸 Daughters of the Kingdom Conference</h3>
            <p>August 2026 | Word Temple Church, Eastleigh</p>
        </div>
        <div class="event-card">
            <h3>👦 Youth Conference - "The Remnant"</h3>
            <p>April 2026 | Word Temple Church, Eastleigh</p>
        </div>
    </div>
</body>
</html>
