<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Settings - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0F0F1A; color: #e0e0e0; }
        .admin-header { background: linear-gradient(135deg, #2A9D8F, #B83B5E); padding: 60px 0; text-align: center; color: white; }
        .admin-header h1 { font-size: 48px; }
        .settings-form { padding: 40px; }
        .form-card { background: #16213e; border-radius: 20px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255,217,102,0.2); }
        .form-card h3 { color: #FFD966; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #e0e0e0; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,217,102,0.3); background: #0F0F1A; color: white; }
        .save-btn { background: linear-gradient(135deg, #FFD966, #F0B429); color: #1a2b4a; padding: 12px 30px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 25px; background: #FFD966; color: #1a2b4a; text-decoration: none; border-radius: 50px; }
        .logout-btn { background: #e74c3c; color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; display: inline-block; margin-top: 20px; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <h1><i class="fas fa-sliders-h"></i> Website Settings</h1>
            <a href="/admin" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <a href="/admin/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="settings-form">
        <form method="POST">
            <div class="form-card">
                <h3>🎨 Theme Settings</h3>
                <div class="form-group"><label>2026 Theme</label><input type="text" name="theme_2026" value="{{ settings.theme_2026 }}"></div>
                <div class="form-group"><label>Theme Scripture</label><input type="text" name="theme_scripture" value="{{ settings.theme_scripture }}"></div>
                <div class="form-group"><label>Theme Verse</label><textarea name="theme_verse" rows="2">{{ settings.theme_verse }}</textarea></div>
            </div>
            <div class="form-card">
                <h3>📢 Announcements</h3>
                {% for ann in settings.announcements %}
                <div class="form-group"><input type="text" name="announcements" value="{{ ann }}"></div>
                {% endfor %}
            </div>
            <div class="form-card">
                <h3>⛪ Sunday Services</h3>
                {% for service in settings.services.sunday %}
                <div class="form-group"><label>{{ service.name }}</label><input type="text" name="sunday_time_{{ loop.index0 }}" value="{{ service.time }}"></div>
                {% endfor %}
            </div>
            <div class="form-card">
                <h3>📅 Weekly Programs</h3>
                {% for program in settings.services.weekly %}
                <div class="form-group"><label>{{ program.day }} - {{ program.name }}</label><input type="text" name="weekly_time_{{ loop.index0 }}" value="{{ program.time }}"></div>
                {% endfor %}
            </div>
            <button type="submit" class="save-btn"><i class="fas fa-save"></i> Save All Settings</button>
        </form>
    </div>
</body>
</html>
